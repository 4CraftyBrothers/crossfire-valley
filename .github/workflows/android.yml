name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # The runner image ships the Android SDK; only the licenses need
      # accepting so Gradle can fetch any platform/build-tools it's missing.
      - run: yes | "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)" --licenses > /dev/null || true
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: crossfire-valley-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # A plain download link that always points at the newest main build:
      # github.com/<owner>/<repo>/releases/tag/android-latest
      - name: Publish to the rolling "android-latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk crossfire-valley-debug.apk
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest crossfire-valley-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "Android test build (latest main)" \
            --notes "Debug APK built from main at ${GITHUB_SHA::7}. Sideload it onto an Android phone or install it in BlueStacks. Updated automatically on every push to main."
