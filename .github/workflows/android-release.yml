name: Android release

# Signed Play Store bundle (.aab) + installable release APK.
#
# One-time setup, no JDK needed locally:
#   1. Add repository secrets ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
#      (e.g. "upload") and ANDROID_KEY_PASSWORD.
#   2. Run this workflow manually with "make_keystore" ticked. Download the
#      "upload-keystore" artifact and save its contents as the secret
#      ANDROID_KEYSTORE_BASE64. Delete the artifact afterwards.
#   3. Push a tag like v0.2.0 (or run the workflow manually) to build.
# Keep the keystore secrets safe: Play ties the app to this key forever.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      make_keystore:
        description: 'Generate a new upload keystore and attach it as an artifact (one-time setup)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  keystore:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.make_keystore }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Generate upload keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Add the ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets first."
            exit 1
          fi
          keytool -genkeypair -v -keystore upload.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
            -alias "${ANDROID_KEY_ALIAS:-upload}" -dname "CN=Crossfire Valley, O=4CraftyBrothers"
          base64 -w0 upload.jks > upload.jks.base64
      - uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: upload.jks.base64
          retention-days: 1

  release:
    if: ${{ github.event_name == 'push' || !inputs.make_keystore }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: yes | "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)" --licenses > /dev/null || true
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing; run this workflow with make_keystore first."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - run: chmod +x android/gradlew
      - name: Build signed bundle and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: crossfire-valley-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
